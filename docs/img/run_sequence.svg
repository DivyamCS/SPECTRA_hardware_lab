<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>SPECTRA: life of a run</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d8796"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker></defs>
<rect width="1000" height="560" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">From the switches to the dashboard</text>
<rect x="10" y="52" width="160" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="90.0" y="77.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="700">You</text>
<line x1="90" y1="92" x2="90" y2="536" stroke="#c4c9d2" stroke-dasharray="4 4"/>
<rect x="215" y="52" width="160" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="295.0" y="77.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="700">Board</text>
<line x1="295" y1="92" x2="295" y2="536" stroke="#c4c9d2" stroke-dasharray="4 4"/>
<rect x="420" y="52" width="160" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="500.0" y="77.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="700">Firmware (both cores)</text>
<line x1="500" y1="92" x2="500" y2="536" stroke="#c4c9d2" stroke-dasharray="4 4"/>
<rect x="625" y="52" width="160" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="705.0" y="77.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="700">Streamer</text>
<line x1="705" y1="92" x2="705" y2="536" stroke="#c4c9d2" stroke-dasharray="4 4"/>
<rect x="830" y="52" width="160" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="910.0" y="77.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="700">Dashboard</text>
<line x1="910" y1="92" x2="910" y2="536" stroke="#c4c9d2" stroke-dasharray="4 4"/>
<path d="M90 128 L291 128" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="192" y="120" font-size="12.5" fill="#1f2937" text-anchor="middle">1. set switches, press BTNC</text>
<path d="M295 168 L335 168 L335 186 L299 186" fill="none" stroke="#7d8796" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="345" y="182" font-size="12.5" fill="#1f2937" text-anchor="start">2. sample SW[15:0] into CONFIG; release core 0 (and core 1 if SW2)</text>
<path d="M500 226 L299 226" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="397" y="218" font-size="12.5" fill="#1f2937" text-anchor="middle">3. write RUN_START: counters clear and start</text>
<path d="M295 272 L701 272" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="500" y="264" font-size="12.5" fill="#1f2937" text-anchor="middle">4. BEGIN packet (config, cores, program)</text>
<path d="M500 318 L299 318" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="397" y="310" font-size="12.5" fill="#1f2937" text-anchor="middle">5. stores to the result buffers (snooped)</text>
<path d="M705 364 L906 364" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="807" y="356" font-size="12.5" fill="#1f2937" text-anchor="middle">6. FRAME / ROW / MROW packets, stamped with the cycle</text>
<path d="M500 410 L299 410" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="397" y="402" font-size="12.5" fill="#1f2937" text-anchor="middle">7. RUN_STOP, CHECKSUM</text>
<path d="M705 456 L906 456" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="807" y="448" font-size="12.5" fill="#1f2937" text-anchor="middle">8. STATS packet: cycles, checksum, per-core counters</text>
<path d="M295 502 L94 502" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="192" y="494" font-size="12.5" fill="#1f2937" text-anchor="middle">9. LED1 = checksum correct; the display tours the results</text>
<rect x="255" y="288" width="735" height="94" rx="8" fill="none" stroke="#9aa4b5" stroke-dasharray="6 4"/>
<text x="982" y="304" font-size="11.5" fill="#5b6575" text-anchor="end">loop: while the program runs</text>
</svg>
